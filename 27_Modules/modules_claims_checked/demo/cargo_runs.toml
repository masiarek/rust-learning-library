# Declared runs for tools/run_cargo_demos.py; each answer key is keys/<stem>.out.

[[run]]
stem = "pg_store_bill"
cmd = ["cargo", "run", "-q", "-p", "pg_store_shop"]

[[run]]
stem = "pg_store_my_binary"
cmd = ["cargo", "run", "-q", "-p", "pg_store_shop", "--bin", "my_binary"]

[[run]]
stem = "pg_store_no_main"
cmd = ["cargo", "build", "-q", "-p", "pg_store_no_main"]
expect = "failure"
stream = "stderr"

