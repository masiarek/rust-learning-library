# MkDocs Material site for the whole repo — publishes every Markdown page as a
# searchable website on GitHub Pages.
#
#   Local preview:  uv run --group docs mkdocs serve
#                   (toolchain pinned in pyproject.toml [dependency-groups].docs + uv.lock)
#   Deploy:         .github/workflows/docs.yml builds on every push to master
#                   (one-time setup: repo Settings → Pages → Source: GitHub Actions)
#
# The docs root IS the repo root (mkdocs-same-dir), so there is no docs/ copy step:
# the same Markdown GitHub renders is what the site serves, and the .rs example
# sources are copied through so links to them keep working.

site_name: Rust — Learning Library
site_description: Learn Rust one runnable page at a time — every claim backed by a program that compiles, runs, and is checked against its recorded output in CI.
site_url: https://masiarek.github.io/rust-learning-library/
repo_url: https://github.com/masiarek/rust-learning-library
repo_name: masiarek/rust-learning-library
edit_uri: edit/master/

docs_dir: .
site_dir: site

# Cross-links are authored for GitHub's file-relative rendering (including links
# to a folder's README.md). Plain .html pages keep those exact semantics; pretty
# directory URLs would shift every page one level deeper and break them.
use_directory_urls: false

# MkDocs maps a README.md onto index.md, so the root README and index.md collide
# ("Excluding README.md because it conflicts with index.md" — a --strict failure).
# Excluding it is right rather than a workaround: its content already IS the
# homepage, inlined by index.md through pymdownx.snippets, which reads from disk
# and so is unaffected by this. GitHub still renders it as the repo front page.
#
# The leading slash anchors the pattern to the repo root. Without it, .gitignore
# semantics would match README.md at ANY depth and silently delete every folder's
# section landing page from the site.
exclude_docs: |
  /README.md
  __pycache__/

# Built and linkable, but kept out of the sidebar. Two kinds of page qualify.
#
# House conventions, which are for someone about to write a page rather than for
# a reader browsing lessons.
#
# And the four METHOD REFERENCES -- 194 pages, one folder per method -- whose own
# folder README is already the directory, and a better one: grouped by what the
# methods are FOR (Sorting / Searching / The ends / Rearranging ...) with a
# one-line summary each, instead of an alphabetical run of 83 sidebar rows. Named
# in both places the sidebar went four levels deep and `HashMap` sat below
# `slice::binary_search`, so the section a reader was standing in scrolled its own
# neighbours off the screen. The index page is the door; search still finds every
# method page by name; and a link from anywhere in the repo still resolves.
#
# Nothing moves on disk. Same folders, same URLs, same links in and out -- the
# sidebar row is the only thing that goes.
#
# Leading slash anchors each pattern to the repo root, as the exclude_docs note
# above explains. `*/README.md` is deliberately one level deep: it takes the
# per-method pages and leaves the reference's own landing page in the nav.
not_in_nav: |
  /CONTRIBUTING.md
  /14_Strings/str_methods/*/README.md
  /14_Strings/string_methods/*/README.md
  /26_Collections/vec_methods/*/README.md
  /26_Collections/slice_methods/*/README.md

theme:
  name: material
  icon:
    logo: material/cog-outline
  features:
    - navigation.indexes    # a folder's README.md becomes its section landing page
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: brown
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Build-time fixes that would otherwise need a plugin (and a new pinned
# dependency): sidebar section labels, which MkDocs derives from folder names.
hooks:
  - mkdocs_hooks.py
  # ...and one that strips the `,ignore` / `,compile_fail` attribute off a
  # ```rust fence. superfences does not accept a comma info string and drops
  # the whole block to literal text; the checker and GitHub both want it.
  - fence_hooks.py

plugins:
  - search
  - same-dir
  # Built into mkdocs-material — no extra dependency. Builds tags.md into a
  # browse-by-tag index from each page's `tags:` front matter.
  - tags
  # A page's URL is a promise. Folders here are permanent addresses, and when
  # one does move — deliberately, and rarely — this is what keeps the old
  # address working instead of handing a reader a 404 they cannot debug.
  #
  # Both sides are source paths, not URLs: `old/README.md: new/README.md`, and
  # the plugin writes a redirect stub at the old page's built location. Three
  # rules, each of them a way this goes wrong quietly:
  #
  #   1. An entry is PERMANENT. Deleting one un-breaks nothing and re-breaks
  #      every link anybody saved. Entries accumulate; they do not get tidied.
  #   2. The key is a historical path and must never be updated. If a page
  #      moves twice, add a SECOND entry from the first old path to the newest
  #      one — redirects do not chain.
  #   3. Every destination must exist on disk. `mkdocs build --strict` does not
  #      check that, so tools/check_redirects.py does.
  - redirects:
      redirect_maps:
        # 2026-08-29: the Functional Rust section was split an hour after it
        # was published, once it was clear that "Functional Rust" is not a name
        # a reader looking for iterators would ever click. Closures kept the
        # folder (renamed), iterators got their own.
        23_Functional/README.md: 23_Closures/README.md
        23_Functional/what_a_closure_is/README.md: 23_Closures/what_a_closure_is/README.md
        23_Functional/three_closure_traits/README.md: 23_Closures/three_closure_traits/README.md
        23_Functional/the_move_keyword/README.md: 23_Closures/the_move_keyword/README.md
        23_Functional/iterators_are_lazy/README.md: 24_Iterators/iterators_are_lazy/README.md
        23_Functional/iter_iter_mut_into_iter/README.md: 24_Iterators/iter_iter_mut_into_iter/README.md
        23_Functional/implementing_iterator/README.md: 24_Iterators/implementing_iterator/README.md

        # 2026-09-02: the struct-design lesson was written around a ballot, back
        # when this library borrowed its examples from its voting sibling. The
        # Rust content never depended on that, so it became a survey record and
        # the folder had to follow the title.
        16_Structs/representing_a_ballot/README.md: 16_Structs/representing_a_record/README.md

        # 2026-09-02: same reason as the line above. The typestate lesson was
        # written around one-person-one-vote; the Rust content is about spending
        # an entitlement exactly once, so it is one-account-one-review now.
        09_Advanced/one_person_one_vote/README.md: 09_Advanced/one_account_one_review/README.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Mermaid diagrams. The custom fence is what makes ```mermaid render as a
  # diagram on the site; GitHub renders the same fence natively, so one source
  # serves both surfaces. Without it the fence ships as a grey code block.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Lets index.md inline sections of README.md, so the repo front page and the
  # site homepage share one source and cannot drift.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/masiarek/rust-learning-library
