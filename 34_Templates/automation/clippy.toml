# Carve-outs for test code. Goes beside Cargo.toml -- `lint_profiles.py apply` puts it there.
#
# training.toml denies unwrap, expect, panic, indexing and dbg!. Inside #[test] and
# #[cfg(test)] those are how a test says "this must hold", so clippy allows them
# there, and nowhere else.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
