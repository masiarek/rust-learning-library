# Production lint profile. Goes in .cargo/config.toml -- `lint_profiles.py apply` puts it there.
#
#   cargo prod          cargo check  --all-targets, every warning an error
#   cargo prod-clippy   cargo clippy --all-targets, every warning an error
#
# The same project as training, training wheels off:
#   -W unused     turns back on the four unused-binding lints training.toml allows.
#                 Cargo passes these flags AFTER the [lints] table, so they win.
#   -D warnings   makes every warning an error, including the ones training only warns about.
#
# The flags are written inline, not as `--config some-file.toml`: a file path
# there is resolved from the directory cargo runs in, so the alias would work at
# the project root and fail in src/. A RUSTFLAGS environment variable replaces
# build.rustflags wholesale, and this profile with it.

[alias]
prod = ["check", "--all-targets", "--config", "build.rustflags = ['-W', 'unused', '-D', 'warnings']"]
prod-clippy = ["clippy", "--all-targets", "--config", "build.rustflags = ['-W', 'unused', '-D', 'warnings']"]
