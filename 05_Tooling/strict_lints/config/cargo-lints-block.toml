# Append this to a project's Cargo.toml, and put config/clippy.toml beside it.
#
# `priority = -1` on the two GROUPS is load-bearing: it makes them apply first,
# so the individual lints below can still override a member of the group.
#
# Source: https://namtao.com/rust  (Tris Oaten / No Boilerplate)
# Explained in: ../README.md

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
